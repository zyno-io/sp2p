<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter Variable";
    src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #0c0d10;
    color: #ececf0;

  .glow {
    position: absolute;
    inset: 0;

      radial-gradient(40% 50% at 2% 92%, rgba(30, 91, 214, 0.20), transparent 70%);

  svg.lines { position: absolute; inset: 0; }
  .line {
    fill: none;
    stroke: #ececf0;
    stroke-opacity: 0.22;
    stroke-width: 2;
    stroke-dasharray: 2 14;
    stroke-linecap: round;
  }
  .line-b { stroke-opacity: 0.12; }
  .copy { position: absolute; left: 88px; top: 86px; }
  .subtitle {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #aeb2bd;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .subtitle::before {
    content: "";
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #5b52f0;
    box-shadow: 0 0 0 5px rgba(91, 82, 240, 0.35);
  }
  .wordmark {
    margin: 26px 0 0 -10px;
    font-size: 250px;
    font-weight: 800;
    letter-spacing: -0.06em;
    line-height: 0.82;
    padding-bottom: 0.17em;
  }
  .two { color: #7c74ff; }
  .lede {
    margin: 4px 0 0;
    font-size: 40px;
    font-weight: 600;
    line-height: 1.3;
    max-width: 900px;
  }
  .foot {
    position: absolute;
    left: 88px;
    right: 88px;
    bottom: 64px;
    display: flex;
    justify-content: space-between;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 24px;
    color: #8b909c;
  }
  .foot b { color: #ececf0; font-weight: 600; }
</style>

  <div class="glow"></div>

    <path class="line" d="M -60 600 C 300 520, 640 120, 1260 140"/>
