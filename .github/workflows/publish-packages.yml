name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      publish_homebrew:
        description: Publish Homebrew formula
        required: false
        default: false
        type: boolean
      publish_scoop:
        description: Publish Scoop manifest
        required: false
        default: false
        type: boolean
      publish_aur:
        description: Publish AUR package
        required: false
        default: false
        type: boolean
      publish_chocolatey:
        description: Publish Chocolatey package
        required: false
        default: false
        type: boolean
      publish_winget:
        description: Publish WinGet manifest pull request
        required: false
        default: false
        type: boolean

# Required secrets (stored in the "release" environment):
#
#   HOMEBREW_TAP_TOKEN       PAT with contents:write on zyno-io/homebrew-tap
#   SCOOP_BUCKET_TOKEN       PAT with contents:write on zyno-io/scoop-bucket
#   AUR_SSH_PRIVATE_KEY      SSH key registered at aur.archlinux.org
#   CHOCOLATEY_API_KEY       API key from community.chocolatey.org
#   WINGET_TOKEN             PAT with public_repo scope
#   SNAPCRAFT_STORE_CREDENTIALS  output of `snapcraft export-login`
#
# Required repos (create once, can be empty):
#
#   zyno-io/homebrew-tap    Homebrew tap (needs Formula/ directory)
#   zyno-io/scoop-bucket       Scoop bucket
#
# AUR: create account + register SSH key + create sp2p-bin package
# Snap: register sp2p name + request classic confinement approval

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REPO: zyno-io/sp2p

# Homebrew, Scoop, AUR, and Chocolatey manifests are all rendered by
# scripts/packaging/render.sh from this run's tag checkout (WinGet keeps its
# own action below). .github/workflows/packaging-validate.yml renders and
# installs the exact same bytes on every relevant PR and after every
# successful Release, without publishing — check that it passed for this tag
# before dispatching this workflow. See docs/testing.md.

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag and derive package version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match ^v\\d+\\.\\d+\\.\\d+$ (got '$TAG')"
            exit 1
          fi
          # The "release" environment only allows deployments from v* tags, so a
          # run dispatched from a branch (e.g. main) fails every job instantly
          # after burning through approvals. Fail fast with an actionable message.
          if [[ "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo "::error::Run this workflow from the release tag: Actions → Publish Packages → Use workflow from → Tags → $TAG (the release environment only allows v* tags)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  homebrew:
    needs: validate-release
    if: inputs.publish_homebrew
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # a persisted GITHUB_TOKEN header must not shadow TAP_TOKEN on the tap clone
      - name: Render Homebrew formula
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" -R "$REPO" -p checksums.txt
          # packaging-validate.yml's release-triggered run renders with this
          # identical base URL, so the two render byte-identical manifests.
          bash scripts/packaging/render.sh homebrew "$VERSION" \
            "https://github.com/${REPO}/releases/download/${TAG}" checksums.txt out
      - name: Update Homebrew tap
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/zyno-io/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/sp2p.rb tap/Formula/sp2p.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sp2p.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "sp2p ${VERSION}"
          git push

  scoop:
    needs: validate-release
    if: inputs.publish_scoop
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # a persisted GITHUB_TOKEN header must not shadow BUCKET_TOKEN on the bucket clone
      - name: Render Scoop manifest
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" -R "$REPO" -p checksums.txt
          bash scripts/packaging/render.sh scoop "$VERSION" \
            "https://github.com/${REPO}/releases/download/${TAG}" checksums.txt out
      - name: Update Scoop bucket
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          git clone "https://x-access-token:${BUCKET_TOKEN}@github.com/zyno-io/scoop-bucket.git" bucket
          cp out/sp2p.json bucket/sp2p.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sp2p.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "sp2p ${VERSION}"
          git push

  aur:
    needs: validate-release
    if: inputs.publish_aur
    runs-on: ubuntu-latest
    environment: release
    container: archlinux:base
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git openssh github-cli diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render AUR package
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" -R "$REPO" -p checksums.txt
          bash scripts/packaging/render.sh aur "$VERSION" \
            "https://github.com/${REPO}/releases/download/${TAG}" checksums.txt out

      - name: Check .SRCINFO against makepkg
        run: |
          # render.sh's .SRCINFO is generated hermetically (no makepkg call, so
          # it can also run outside this container); cross-check it here
          # against a real `makepkg --printsrcinfo`, which refuses to run as
          # root, hence the throwaway build user.
          useradd -m builder
          cp out/PKGBUILD /home/builder/
          chown builder: /home/builder/PKGBUILD
          su builder -c 'cd /home/builder && makepkg --printsrcinfo' | diff -u - out/.SRCINFO

      - name: Publish to AUR
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          SSH_DIR="$(mktemp -d)"
          trap 'rm -rf "$SSH_DIR"' EXIT
          install -m 700 -d "$SSH_DIR"
          umask 077
          printf '%s' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > "$SSH_DIR/aur"
          if ! ssh-keygen -lf "$SSH_DIR/aur" >/dev/null 2>&1; then
            printf '%s' "$AUR_SSH_PRIVATE_KEY" | base64 -d > "$SSH_DIR/aur" 2>/dev/null || true
          fi
          if ! ssh-keygen -lf "$SSH_DIR/aur" >/dev/null 2>&1; then
            printf '%b' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > "$SSH_DIR/aur"
          fi
          ssh-keygen -lf "$SSH_DIR/aur" >/dev/null
          chmod 600 "$SSH_DIR/aur"
          ssh-keyscan -H aur.archlinux.org > "$SSH_DIR/known_hosts"

          GIT_SSH_COMMAND="ssh -F /dev/null -i $SSH_DIR/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=yes" \
            git clone ssh://aur@aur.archlinux.org/sp2p-bin.git aur-repo
          # LICENSE comes from this tag's checkout (this job runs from the
          # release tag), not a separate main-branch fetch.
          cp out/PKGBUILD out/.SRCINFO LICENSE aur-repo/
          cd aur-repo
          git config core.sshCommand "ssh -F /dev/null -i $SSH_DIR/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=yes"
          git config user.name "Zyno Consulting"
          git config user.email "oss@zyno.io"
          git add PKGBUILD .SRCINFO LICENSE
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update to ${VERSION}"
          git push

  chocolatey:
    needs: validate-release
    if: inputs.publish_chocolatey
    runs-on: windows-latest
    environment: release
    steps:
      # Git Bash (this runner's `bash`) can't check out or run a CRLF
      # render.sh; must run before checkout (ci.yml does the same).
      - name: Disable git's CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render Chocolatey package
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" -R "$REPO" -p checksums.txt
          bash scripts/packaging/render.sh chocolatey "$VERSION" \
            "https://github.com/${REPO}/releases/download/${TAG}" checksums.txt pkg
      - name: Pack and push Chocolatey package
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: pwsh
        run: |
          $version = "$env:VERSION"

          Push-Location pkg
          choco pack
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed with exit code $LASTEXITCODE" }
          $existing = Invoke-WebRequest `
            -Method Head `
            -Uri "https://community.chocolatey.org/api/v2/package/sp2p/$version" `
            -SkipHttpErrorCheck
          if ($existing.StatusCode -eq 200) {
            Write-Output "Chocolatey already has sp2p $version; skipping push."
          } elseif ($existing.StatusCode -eq 404) {
            choco push "sp2p.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          } else {
            throw "Unexpected Chocolatey package lookup status: $($existing.StatusCode)"
          }

  winget:
    needs: validate-release
    if: inputs.publish_winget
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check for an existing WinGet pull request
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          # komac (via winget-releaser) titles its PR "New version: zyno-io.sp2p
          # version $VERSION" regardless of which fork it opens from. Listing
          # only the first 100 open PRs missed submissions further back in the
          # queue; search matches on the exact quoted title instead.
          PR_URL=$(gh search prs --repo microsoft/winget-pkgs --state open --match title \
            "\"zyno-io.sp2p version ${VERSION}\"" --json url --jq '.[0].url // empty')
          if [ -n "$PR_URL" ]; then
            echo "WinGet submission already exists: $PR_URL"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Accept Winget fork invitation
        if: steps.existing-pr.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          INVITATION_ID=$(gh api user/repository_invitations --jq \
            '.[] | select(.repository.full_name == "zyno-io/winget-pkgs") | .id')
          if [ -n "$INVITATION_ID" ]; then
            gh api --method PATCH "user/repository_invitations/$INVITATION_ID"
          fi

      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        if: steps.existing-pr.outputs.exists != 'true'
        with:
          identifier: zyno-io.sp2p
          version: ${{ needs.validate-release.outputs.version }}
          installers-regex: 'sp2p_windows_(amd64|arm64)\.zip$'
          release-tag: ${{ needs.validate-release.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}

