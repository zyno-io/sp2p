name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit
      - run: make build-web
      - name: Build pinned rsync integration fixture
        shell: bash
        run: |
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/sp2p-rsync.XXXXXX")
          curl --fail --location --proto '=https' --tlsv1.2 https://download.samba.org/pub/rsync/src/rsync-3.4.1.tar.gz -o "$fixture_dir/rsync.tar.gz"
          printf '2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52  %s\n' "$fixture_dir/rsync.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/rsync.tar.gz" -C "$fixture_dir"
          cd "$fixture_dir/rsync-3.4.1"
          ./configure --disable-xxhash --disable-zstd --disable-lz4 --disable-openssl --disable-md2man
          make -j2
          printf 'SP2P_TEST_RSYNC=%s/rsync\n' "$PWD" >> "$GITHUB_ENV"
      - run: make test
      - name: Build legacy macOS-era rsync protocol fixture
        shell: bash
        run: |
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/sp2p-rsync269.XXXXXX")
          curl --fail --location --proto '=https' --tlsv1.2 https://download.samba.org/pub/rsync/src/rsync-2.6.9.tar.gz -o "$fixture_dir/rsync.tar.gz"
          printf 'ca437301becd890e73300bc69a39189ff1564baa761948ff149b3dd7bde633f9  %s\n' "$fixture_dir/rsync.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/rsync.tar.gz" -C "$fixture_dir"
          cd "$fixture_dir/rsync-2.6.9"
          CFLAGS='-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types' ./configure
          make -j2
          printf 'SP2P_TEST_RSYNC_PEER=%s/rsync\n' "$PWD" >> "$GITHUB_ENV"
      - name: Check legacy and mixed-version rsync transfers
        run: go test ./internal -run '^TestStreamCLI$/rsync' -count=1 -timeout=6m
      - run: go vet ./...
      - run: go test -race ./internal/crypto ./internal/transfer ./internal/flow ./internal/conn ./internal/server ./internal/archive ./internal/fileutil ./internal/peer ./internal/stream ./internal/tunnel ./internal/rsync ./internal/cli

  macos-rsync:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make build-web
      - name: Build upstream rsync for mixed-version tests
        shell: bash
        run: |
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/sp2p-rsync.XXXXXX")
          curl --fail --location --proto '=https' --tlsv1.2 https://download.samba.org/pub/rsync/src/rsync-3.4.1.tar.gz -o "$fixture_dir/rsync.tar.gz"
          printf '2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52  %s\n' "$fixture_dir/rsync.tar.gz" | shasum -a 256 --check
          tar -xzf "$fixture_dir/rsync.tar.gz" -C "$fixture_dir"
          cd "$fixture_dir/rsync-3.4.1"
          ./configure --disable-xxhash --disable-zstd --disable-lz4 --disable-openssl --disable-md2man
          make -j2
          printf 'SP2P_TEST_RSYNC_PEER=%s/rsync\n' "$PWD" >> "$GITHUB_ENV"
      - name: Check built-in and mixed-version rsync transfers
        run: go test ./internal -run '^TestStreamCLI$/rsync' -count=1 -timeout=6m
        env:
          # Do not use PATH: Homebrew must not mask a bundled-rsync regression.
          SP2P_TEST_RSYNC: /usr/bin/rsync
      - name: Check built-in rsync adapter policies
        run: go test -race ./internal/rsync ./internal/tunnel ./internal/cli
        env:
          SP2P_TEST_RSYNC: /usr/bin/rsync

  browser-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npx playwright test

  protocol-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Immutable v0.4.0 source; never execute a moving release download.
          ref: 7a616cd5ac1b51f7ad8d1b1de85a91780fff1ccb
          path: .compat-v0.4.0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build unmodified legacy fixtures
        working-directory: .compat-v0.4.0
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          go build -o bin/sp2p ./cmd/sp2p
          go build -o bin/sp2p-server ./cmd/sp2p-server
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Check CLI and server version matrix
        run: go test ./internal -run '^TestE2E_ProtocolCompatibility$' -count=1 -timeout=12m
        env:
          SP2P_TEST_LEGACY_BINARY: ${{ github.workspace }}/.compat-v0.4.0/bin/sp2p
          SP2P_TEST_LEGACY_SERVER_BINARY: ${{ github.workspace }}/.compat-v0.4.0/bin/sp2p-server
      - run: cd web && npx playwright install --with-deps chromium
      - name: Check browser and CLI cross-release transfers
        run: cd web && npx playwright test tests/compatibility.spec.ts
        env:
          SP2P_TEST_LEGACY_BINARY: ${{ github.workspace }}/.compat-v0.4.0/bin/sp2p
          SP2P_TEST_LEGACY_WEB_DIR: ${{ github.workspace }}/.compat-v0.4.0/web/dist

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, macos-rsync, browser-interop, protocol-compatibility]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build-web
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.0
          args: release --snapshot --clean --skip=publish,docker,sign
        env:
          APK_SIGNING_KEY: /dev/null
          SP2P_VERSION: 0.0.0-snapshot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
