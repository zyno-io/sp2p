name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit
      - run: make build-web
      - name: Build pinned rsync integration fixture
        shell: bash
        run: |
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/sp2p-rsync.XXXXXX")
          # Bound upstream outages; the same pinned checksum gates either source.
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --retry 1 \
            https://download.samba.org/pub/rsync/src/rsync-3.4.1.tar.gz -o "$fixture_dir/rsync.tar.gz" || \
            curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --retry 1 \
              https://slackware.mirror.garr.it/rsync/src/rsync-3.4.1.tar.gz -o "$fixture_dir/rsync.tar.gz"
          printf '2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52  %s\n' "$fixture_dir/rsync.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/rsync.tar.gz" -C "$fixture_dir"
          cd "$fixture_dir/rsync-3.4.1"
          ./configure --disable-xxhash --disable-zstd --disable-lz4 --disable-openssl --disable-md2man
          make -j2
          printf 'SP2P_TEST_RSYNC=%s/rsync\n' "$PWD" >> "$GITHUB_ENV"
      - run: make test
      - name: Build legacy macOS-era rsync protocol fixture
        shell: bash
        run: |
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/sp2p-rsync269.XXXXXX")
          # Bound upstream outages; the same pinned checksum gates either source.
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --retry 1 \
            https://download.samba.org/pub/rsync/src/rsync-2.6.9.tar.gz -o "$fixture_dir/rsync.tar.gz" || \
            curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --retry 1 \
              https://slackware.mirror.garr.it/rsync/src/rsync-2.6.9.tar.gz -o "$fixture_dir/rsync.tar.gz"
          printf 'ca437301becd890e73300bc69a39189ff1564baa761948ff149b3dd7bde633f9  %s\n' "$fixture_dir/rsync.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/rsync.tar.gz" -C "$fixture_dir"
          cd "$fixture_dir/rsync-2.6.9"
          CFLAGS='-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types' ./configure
          make -j2
          printf 'SP2P_TEST_RSYNC_PEER=%s/rsync\n' "$PWD" >> "$GITHUB_ENV"
      - name: Check legacy and mixed-version rsync transfers
        run: go test ./internal -run '^TestStreamCLI$/rsync' -count=1 -timeout=6m
      - run: go vet ./...
      - run: go test -race ./internal/crypto ./internal/transfer ./internal/flow ./internal/conn ./internal/server ./internal/archive ./internal/fileutil ./internal/peer ./internal/stream ./internal/tunnel ./internal/rsync ./internal/cli ./internal/testturn

  macos-rsync:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make build-web
      - name: Build upstream rsync for mixed-version tests
        shell: bash
        run: |
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/sp2p-rsync.XXXXXX")
          curl --fail --location --proto '=https' --tlsv1.2 https://download.samba.org/pub/rsync/src/rsync-3.4.1.tar.gz -o "$fixture_dir/rsync.tar.gz"
          printf '2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52  %s\n' "$fixture_dir/rsync.tar.gz" | shasum -a 256 --check
          tar -xzf "$fixture_dir/rsync.tar.gz" -C "$fixture_dir"
          cd "$fixture_dir/rsync-3.4.1"
          ./configure --disable-xxhash --disable-zstd --disable-lz4 --disable-openssl --disable-md2man
          make -j2
          printf 'SP2P_TEST_RSYNC_PEER=%s/rsync\n' "$PWD" >> "$GITHUB_ENV"
      - name: Check built-in and mixed-version rsync transfers
        run: go test ./internal -run '^TestStreamCLI$/rsync' -count=1 -timeout=6m
        env:
          # Do not use PATH: Homebrew must not mask a bundled-rsync regression.
          SP2P_TEST_RSYNC: /usr/bin/rsync
      - name: Check built-in rsync adapter policies
        run: go test -race ./internal/rsync ./internal/tunnel ./internal/cli
        env:
          SP2P_TEST_RSYNC: /usr/bin/rsync

  browser-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npx playwright test --project=chromium

  browser-firefox:
    # Not required yet: gates PRs (runs on every PR) but is not in build's
    # needs. Promote once it's proven stable for a while — see docs/testing.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps firefox chromium
      - run: cd web && npx playwright test --project=firefox
      - run: cd web && npx playwright test --project=engines --grep @pr

  protocol-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Immutable v0.4.0 source; never execute a moving release download.
          # Policy: a release tag must never move once pushed. If one ever
          # has to (as v0.5.0 did below), pin its pre-move SHA here instead
          # of the tag — see the "Pinned fixtures" policy in docs/testing.md.
          ref: 7a616cd5ac1b51f7ad8d1b1de85a91780fff1ccb
          path: .compat-v0.4.0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Existing v3 peers must keep working when v0.5.0 is re-released.
          # This is v0.5.0's pre-move SHA (the tag itself was later moved to
          # a newer commit) — see the pinned-fixtures policy above.
          ref: d303e1a947ca8ef6bb000dfe8660e7a05c7738cd
          path: .compat-v0.5.0
          persist-credentials: false
      - name: Resolve previous release
        id: previous
        # git ls-remote queries origin directly, so this needs no extra tag
        # fetch even with the primary checkout's default shallow history.
        run: bash scripts/ci/previous-release.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
      - name: Build unmodified legacy fixtures
        working-directory: .compat-v0.4.0
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          go build -o bin/sp2p ./cmd/sp2p
          go build -o bin/sp2p-server ./cmd/sp2p-server
      - name: Build unmodified v3 fixtures
        working-directory: .compat-v0.5.0
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          go build -o bin/sp2p ./cmd/sp2p
      - name: Build previous-release fixture (.compat-prev)
        uses: ./.github/actions/build-release-fixture
        with:
          sha: ${{ steps.previous.outputs.sha }}
          version: ${{ steps.previous.outputs.version }}
          path: .compat-prev
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Check CLI and server version matrix
        run: go test ./internal -run '^TestE2E_ProtocolCompatibility$' -count=1 -timeout=15m
        env:
          SP2P_TEST_LEGACY_BINARY: ${{ github.workspace }}/.compat-v0.4.0/bin/sp2p
          SP2P_TEST_LEGACY_SERVER_BINARY: ${{ github.workspace }}/.compat-v0.4.0/bin/sp2p-server
          SP2P_TEST_PREVIOUS_BINARY: ${{ github.workspace }}/.compat-prev/bin/sp2p
          SP2P_TEST_PREVIOUS_SERVER_BINARY: ${{ github.workspace }}/.compat-prev/bin/sp2p-server
          SP2P_TEST_PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
      - run: cd web && npx playwright install --with-deps chromium
      - name: Check browser and CLI cross-release transfers
        run: cd web && npx playwright test tests/compatibility.spec.ts --reporter=list
        env:
          SP2P_TEST_LEGACY_BINARY: ${{ github.workspace }}/.compat-v0.4.0/bin/sp2p
          SP2P_TEST_LEGACY_WEB_DIR: ${{ github.workspace }}/.compat-v0.4.0/web/dist
          SP2P_TEST_V3_BINARY: ${{ github.workspace }}/.compat-v0.5.0/bin/sp2p
          SP2P_TEST_V3_WEB_DIR: ${{ github.workspace }}/.compat-v0.5.0/web/dist
          SP2P_TEST_PREVIOUS_BINARY: ${{ github.workspace }}/.compat-prev/bin/sp2p
          SP2P_TEST_PREVIOUS_WEB_DIR: ${{ github.workspace }}/.compat-prev/web/dist
          SP2P_TEST_PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}

  # Shadow period: intentionally not in build.needs and not a required check
  # yet. See docs/testing.md for the design and how to read its results.
  netem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SP2P_NETEM_PROFILE: wan150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build-web
      - name: Build CLI and server binaries
        run: |
          go build -o bin/sp2p ./cmd/sp2p
          go build -o bin/sp2p-server ./cmd/sp2p-server
      # Everything above needs the network; nothing below should — the
      # netem suite runs inside a namespace with no route to the internet.
      - run: cd web && npx playwright install --with-deps chromium
      - name: Load the netem qdisc kernel module
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
      - name: Ensure ethtool is available
        run: command -v ethtool || (sudo apt-get update && sudo apt-get install -y ethtool)
      - name: Widen host UDP socket buffer ceilings (for Chrome's 1 MiB buffer hint)
        run: sudo sysctl -w net.core.rmem_max=4194304 net.core.wmem_max=4194304
      - name: Create the sp2p network namespace
        run: sudo scripts/ci/netns.sh up
      - name: Apply netem shaping (wan150)
        run: sudo scripts/ci/netem.sh apply wan150
      - name: Preflight — hard-fail unless the shaped RTT is 140-200ms
        run: sudo scripts/ci/netem.sh verify wan150
      - name: Run the netem suite inside the namespace
        run: |
          cd web
          "$GITHUB_WORKSPACE/scripts/ci/netns.sh" exec -- npx playwright test --project=netem
        env:
          SP2P_PW_SKIP_WEB_BUILD: "1"
          SP2P_PW_CLI_BIN: ${{ github.workspace }}/bin/sp2p
          SP2P_PW_SERVER_BIN: ${{ github.workspace }}/bin/sp2p-server
      - name: netem qdisc stats (post-run, for the job log)
        if: always()
        run: sudo scripts/ci/netem.sh stats || true
      - name: Performance summary (fails on missing pairings)
        if: always()
        run: node web/tests/perf-summary.mjs --gate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: netem-perf
          path: test-results/perf/**
          if-no-files-found: ignore
      - name: Tear down the network namespace
        if: always()
        run: sudo scripts/ci/netns.sh down

  # Shadow period: intentionally not in build.needs and not a required check
  # yet, same as netem above. See docs/testing.md's TURN relay section for
  # the design and how to read its results.
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SP2P_RELAY_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build-web
      - name: Build CLI, server, and test-TURN binaries
        run: |
          go build -o bin/sp2p ./cmd/sp2p
          go build -o bin/sp2p-server ./cmd/sp2p-server
          go build -o bin/testturnd ./internal/testturn/testturnd
      - run: cd web && npx playwright install --with-deps chromium
      - name: Ensure ethtool and iptables are available
        run: command -v ethtool && command -v iptables || (sudo apt-get update && sudo apt-get install -y ethtool iptables)
      - name: Create the sp2p network namespace
        run: sudo scripts/ci/netns.sh up
      - name: Apply the relay-only firewall
        run: sudo scripts/ci/relay-firewall.sh apply
      - name: Preflight — hard-fail unless the relay-only firewall is in place
        run: sudo scripts/ci/relay-firewall.sh verify
      - name: Run the relay suite (PR subset) inside the namespace
        run: |
          cd web
          "$GITHUB_WORKSPACE/scripts/ci/netns.sh" exec -- npx playwright test --project=relay --grep @pr
        env:
          SP2P_PW_SKIP_WEB_BUILD: "1"
          SP2P_PW_CLI_BIN: ${{ github.workspace }}/bin/sp2p
          SP2P_PW_SERVER_BIN: ${{ github.workspace }}/bin/sp2p-server
          SP2P_PW_TESTTURND_BIN: ${{ github.workspace }}/bin/testturnd
      - name: Firewall counters (post-run, for the job log)
        if: always()
        run: sudo scripts/ci/relay-firewall.sh stats || true
      - name: Relay summary (fails on missing pairings)
        if: always()
        run: node web/tests/relay-summary.mjs --gate --expect pr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: relay-turn-stats
          path: test-results/relay/**
          if-no-files-found: ignore
      - name: Tear down the network namespace
        if: always()
        run: sudo scripts/ci/netns.sh down

  # Shadow period: intentionally not in build.needs and not a required check
  # yet, same as netem/relay above. See docs/testing.md's Windows section for
  # the design and how to read its results. No throughput/performance floors
  # here — per-packet CPU cost on Windows/VM runners is environmental, not a
  # product regression signal (see docs/browser-high-rtt.md).
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # No -race below: the race detector needs cgo, which CGO_ENABLED=0
      # (this repo's static-binary convention) rules out.
      CGO_ENABLED: "0"
    steps:
      # Must run before checkout: TestBootstrapTemplatesMatchGenerator
      # compares scripts/bootstrap-*.sh byte-for-byte against a generated
      # copy, and the git index is 100% LF — a CRLF checkout breaks that.
      - name: Disable git's CRLF conversion
        run: git config --global core.autocrlf false
      - name: Disable Windows Defender real-time scanning (best-effort; speeds up build/test I/O)
        continue-on-error: true
        run: |
          try {
            Write-Host "Defender real-time monitoring before: $((Get-MpPreference).DisableRealtimeMonitoring)"
            Set-MpPreference -DisableRealtimeMonitoring $true
            Write-Host "Defender real-time monitoring after: $((Get-MpPreference).DisableRealtimeMonitoring)"
          } catch {
            Write-Warning "Could not toggle Defender real-time monitoring: $_"
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Build web assets
        id: web
        # web.go's //go:embed web/dist/* requires this before any Go build/vet/test
        # below. Not `make build-web`: `make` isn't guaranteed on this runner image.
        run: npm --prefix web run build
      - name: go vet (only place CI vets *_windows.go)
        run: go vet ./...
      - name: go test ./...
        run: go test ./... -count=1 -timeout=20m
      - name: Locate Edge
        id: edge
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        # Edge is preinstalled on windows-latest; `playwright install msedge`
        # must NOT be run — under CI=true it skips Playwright's own
        # already-installed guard and reinstalls Edge via MSI over the image's
        # copy. Fail fast with a clear message if it's ever missing instead.
        run: |
          $candidates = @(
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) {
            Write-Error "msedge.exe not found at any of: $($candidates -join ', ')"
            exit 1
          }
          Write-Host "Found Edge $((Get-Item $edge).VersionInfo.ProductVersion) at $edge"
      - name: Edge/CLI interop specs (--project=msedge)
        if: ${{ !cancelled() && steps.web.outcome == 'success' && steps.edge.outcome == 'success' }}
        working-directory: web
        # No SP2P_PW_*_BIN overrides: global-setup's Windows .exe build path
        # must actually run in CI, not just locally.
        run: npx playwright test --project=msedge
      - name: Windows networking diagnostics
        if: failure()
        run: |
          netsh interface ipv4 show excludedportrange protocol=tcp
          Get-NetFirewallProfile

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, macos-rsync, browser-interop, protocol-compatibility]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build-web
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,docker,sign
        env:
          APK_SIGNING_KEY: /dev/null
          SP2P_VERSION: 0.0.0-snapshot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
