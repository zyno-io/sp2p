name: Extended checks

# Slower checks that don't run on every PR. They run after each merge to
# main, so a failure points at one change; release.yml requires a green run
# on the tagged commit; and a weekly run catches browser and runner drift.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netem-extended:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SP2P_NETEM_PROFILE: ${{ matrix.profile }}
      # Gate on medians across repeats (perf-summary.mjs), not on each repeat.
      SP2P_NETEM_GATE_PER_TEST: "0"
    strategy:
      fail-fast: false
      matrix:
        profile: [wan150-cap, wan500]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build-web
      - name: Build CLI and server binaries
        run: |
          go build -o bin/sp2p ./cmd/sp2p
          go build -o bin/sp2p-server ./cmd/sp2p-server
      # Everything above needs the network; nothing below should — the
      # netem suite runs inside a namespace with no route to the internet.
      - run: cd web && npx playwright install --with-deps chromium
      - name: Load the netem qdisc kernel module
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
      - name: Ensure ethtool is available
        run: command -v ethtool || (sudo apt-get update && sudo apt-get install -y ethtool)
      - name: Widen host UDP socket buffer ceilings (for Chrome's 1 MiB buffer hint)
        run: sudo sysctl -w net.core.rmem_max=4194304 net.core.wmem_max=4194304
      - name: Create the sp2p network namespace
        run: sudo scripts/ci/netns.sh up
      - name: Apply netem shaping (${{ matrix.profile }})
        run: sudo scripts/ci/netem.sh apply ${{ matrix.profile }}
      - name: Preflight — hard-fail unless the shaped RTT is in band
        run: sudo scripts/ci/netem.sh verify ${{ matrix.profile }}
      - name: Run the netem suite inside the namespace (repeat-each=3)
        run: |
          cd web
          "$GITHUB_WORKSPACE/scripts/ci/netns.sh" exec -- npx playwright test --project=netem --repeat-each=3
        env:
          SP2P_PW_SKIP_WEB_BUILD: "1"
          SP2P_PW_CLI_BIN: ${{ github.workspace }}/bin/sp2p
          SP2P_PW_SERVER_BIN: ${{ github.workspace }}/bin/sp2p-server
      - name: netem qdisc stats (post-run, for the job log)
        if: always()
        run: sudo scripts/ci/netem.sh stats || true
      - name: Performance summary (gate on medians of the 3 repeats)
        if: always()
        run: node web/tests/perf-summary.mjs --gate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: netem-extended-perf-${{ matrix.profile }}
          path: test-results/perf/**
          if-no-files-found: ignore
      - name: Tear down the network namespace
        if: always()
        run: sudo scripts/ci/netns.sh down

  # Large (1 GiB) transfer checks: stalls, integrity, and memory that scales
  # with file size, across all four pairings (browser-browser, browser-CLI,
  # CLI-browser, CLI-CLI auto). `clean` runs directly on the runner; `wan150`
  # reuses netem-extended's namespace/shaping setup. See docs/testing.md's
  # large-transfer section.
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SP2P_LARGE_TEST: "1"
    strategy:
      fail-fast: false
      matrix:
        profile: [clean, wan150]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build-web
      - name: Build the crypto test bundle (large.spec.ts's streaming SHA-256 receiver hash)
        run: cd web && npx esbuild src/crypto-test-entry.ts --bundle --outfile=dist/crypto-test.js --target=es2020
      - name: Build CLI and server binaries
        run: |
          go build -o bin/sp2p ./cmd/sp2p
          go build -o bin/sp2p-server ./cmd/sp2p-server
      - run: cd web && npx playwright install --with-deps chromium
      - name: Disk headroom (for the job log)
        run: df -h
      # wan150-only setup, reusing netem-extended's steps (see that job above).
      - name: Load the netem qdisc kernel module
        if: matrix.profile == 'wan150'
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
      - name: Ensure ethtool is available
        if: matrix.profile == 'wan150'
        run: command -v ethtool || (sudo apt-get update && sudo apt-get install -y ethtool)
      - name: Widen host UDP socket buffer ceilings (for Chrome's 1 MiB buffer hint)
        if: matrix.profile == 'wan150'
        run: sudo sysctl -w net.core.rmem_max=4194304 net.core.wmem_max=4194304
      - name: Create the sp2p network namespace
        if: matrix.profile == 'wan150'
        run: sudo scripts/ci/netns.sh up
      - name: Apply netem shaping (wan150)
        if: matrix.profile == 'wan150'
        run: sudo scripts/ci/netem.sh apply wan150
      - name: Preflight — hard-fail unless the shaped RTT is in band
        if: matrix.profile == 'wan150'
        run: sudo scripts/ci/netem.sh verify wan150
      # Everything above needs the network (or, for wan150, must run outside
      # the namespace); nothing below should.
      - name: Run the large suite (clean, direct on the runner)
        if: matrix.profile == 'clean'
        run: cd web && npx playwright test --project=large
        env:
          SP2P_PW_SKIP_WEB_BUILD: "1"
          SP2P_PW_CLI_BIN: ${{ github.workspace }}/bin/sp2p
          SP2P_PW_SERVER_BIN: ${{ github.workspace }}/bin/sp2p-server
      - name: Run the large suite (wan150, inside the namespace)
        if: matrix.profile == 'wan150'
        run: |
          cd web
          "$GITHUB_WORKSPACE/scripts/ci/netns.sh" exec -- npx playwright test --project=large
        env:
          SP2P_PW_SKIP_WEB_BUILD: "1"
          SP2P_PW_CLI_BIN: ${{ github.workspace }}/bin/sp2p
          SP2P_PW_SERVER_BIN: ${{ github.workspace }}/bin/sp2p-server
      - name: netem qdisc stats (post-run, for the job log)
        if: always() && matrix.profile == 'wan150'
        run: sudo scripts/ci/netem.sh stats || true
      - name: Large-transfer summary
        if: always()
        run: node web/tests/large-summary.mjs --gate
      # Numeric perf JSON only — no traces/screenshots (would capture
      # transfer codes; the "large" Playwright project already disables them).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: large-perf-${{ matrix.profile }}
          path: test-results/perf-large/**
          if-no-files-found: ignore
      - name: Tear down the network namespace
        if: always() && matrix.profile == 'wan150'
        run: sudo scripts/ci/netns.sh down

  # WebKit's real DataChannel/ICE/OPFS behavior is closest to Safari's on
  # macOS, so this always builds and runs on macos-15 (never ubuntu-latest),
  # and Firefox/Chromium cells of the full matrix ride along here too since
  # the runner is already paid for. WebKit starts extended-checks only (after
  # merge / weekly / pre-release); browser-firefox (ci.yml) already gates PRs
  # on Firefox plus the @pr-tagged engine-matrix
  # cells. See docs/testing.md's "Engines" section for local validation.
  engines:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps webkit firefox chromium
      - run: cd web && npx playwright test --project=webkit
      - run: cd web && npx playwright test --project=engines

  # N-2 previous-release compatibility: the protocol-compatibility job in
  # ci.yml only ever exercises N-1 (scripts/ci/previous-release.sh's default
  # --nth 1); this Extended checks leg additionally exercises N-2, so a peer two
  # releases back doesn't silently regress between whenever it stops being
  # "the previous release" and whenever someone happens to test it by hand.
  compat-n2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve N-2 previous release
        id: previous
        # git ls-remote queries origin directly, so this needs no extra tag
        # fetch even with the primary checkout's default shallow history.
        run: bash scripts/ci/previous-release.sh --nth 2 >> "$GITHUB_OUTPUT"
      - name: Build N-2 fixture (.compat-n2)
        uses: ./.github/actions/build-release-fixture
        with:
          sha: ${{ steps.previous.outputs.sha }}
          version: ${{ steps.previous.outputs.version }}
          path: .compat-n2
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Check CLI and server version matrix (N-2)
        run: go test ./internal -run '^TestE2E_ProtocolCompatibility$' -count=1 -timeout=15m
        env:
          SP2P_TEST_PREVIOUS_BINARY: ${{ github.workspace }}/.compat-n2/bin/sp2p
          SP2P_TEST_PREVIOUS_SERVER_BINARY: ${{ github.workspace }}/.compat-n2/bin/sp2p-server
          SP2P_TEST_PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
      - run: cd web && npx playwright install --with-deps chromium
      - name: Check browser and CLI cross-release transfers (N-2)
        run: cd web && npx playwright test tests/compatibility.spec.ts --reporter=list
        env:
          SP2P_TEST_PREVIOUS_BINARY: ${{ github.workspace }}/.compat-n2/bin/sp2p
          SP2P_TEST_PREVIOUS_WEB_DIR: ${{ github.workspace }}/.compat-n2/web/dist
          SP2P_TEST_PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}

  # Full relay-only TURN matrix (all pairings incl. Firefox, the per-user
  # quota case, and the consent-decline negative controls) — the Extended
  # checks counterpart to ci.yml's PR-gated `relay` job. See docs/testing.md's
  # TURN relay section.
  relay-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SP2P_RELAY_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build-web
      - name: Build CLI, server, and test-TURN binaries
        run: |
          go build -o bin/sp2p ./cmd/sp2p
          go build -o bin/sp2p-server ./cmd/sp2p-server
          go build -o bin/testturnd ./internal/testturn/testturnd
      - run: cd web && npx playwright install --with-deps firefox chromium
      - name: Ensure ethtool and iptables are available
        run: command -v ethtool && command -v iptables || (sudo apt-get update && sudo apt-get install -y ethtool iptables)
      - name: Create the sp2p network namespace
        run: sudo scripts/ci/netns.sh up
      - name: Apply the relay-only firewall
        run: sudo scripts/ci/relay-firewall.sh apply
      - name: Preflight — hard-fail unless the relay-only firewall is in place
        run: sudo scripts/ci/relay-firewall.sh verify
      - name: Run the full relay suite inside the namespace
        run: |
          cd web
          "$GITHUB_WORKSPACE/scripts/ci/netns.sh" exec -- npx playwright test --project=relay
        env:
          SP2P_PW_SKIP_WEB_BUILD: "1"
          SP2P_PW_CLI_BIN: ${{ github.workspace }}/bin/sp2p
          SP2P_PW_SERVER_BIN: ${{ github.workspace }}/bin/sp2p-server
          SP2P_PW_TESTTURND_BIN: ${{ github.workspace }}/bin/testturnd
      - name: Firewall counters (post-run, for the job log)
        if: always()
        run: sudo scripts/ci/relay-firewall.sh stats || true
      - name: Relay summary (fails on missing pairings)
        if: always()
        run: node web/tests/relay-summary.mjs --gate --expect full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: relay-turn-stats-extended
          path: test-results/relay/**
          if-no-files-found: ignore
      - name: Tear down the network namespace
        if: always()
        run: sudo scripts/ci/netns.sh down

  # Runs regardless of which job(s) failed (fail-fast is off on the netem
  # matrix, and compat-n2/engines/relay-full are independent of it and each
  # other), and only on failure — a passing run stays silent.
  report-failure:
    needs: [netem-extended, compat-n2, engines, relay-full, large]
    # A leg that hits timeout-minutes is reported as cancelled, not failed.
    # Manual dispatches (e.g. validating a branch) report in the run only.
    if: (failure() || cancelled()) && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the extended-checks failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NETEM_RESULT: ${{ needs.netem-extended.result }}
          COMPAT_N2_RESULT: ${{ needs.compat-n2.result }}
          ENGINES_RESULT: ${{ needs.engines.result }}
          RELAY_RESULT: ${{ needs.relay-full.result }}
          LARGE_RESULT: ${{ needs.large.result }}
        run: |
          set -euo pipefail
          gh label create extended-checks --color b60205 \
            --description "Extended checks failures" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          title="Extended checks failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label extended-checks --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number')

          failed=""
          if [[ "$NETEM_RESULT" != "success" ]]; then failed+="- netem-extended: $NETEM_RESULT\n"; fi
          if [[ "$COMPAT_N2_RESULT" != "success" ]]; then failed+="- compat-n2: $COMPAT_N2_RESULT\n"; fi
          if [[ "$ENGINES_RESULT" != "success" ]]; then failed+="- engines: $ENGINES_RESULT\n"; fi
          if [[ "$RELAY_RESULT" != "success" ]]; then failed+="- relay-full: $RELAY_RESULT\n"; fi
          if [[ "$LARGE_RESULT" != "success" ]]; then failed+="- large: $LARGE_RESULT\n"; fi

          note="Run: $RUN_URL (branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA:0:12}\`)."
          jobs=$(printf '%b' "$failed")
          detail="See the job summary and artifacts on this run for details. netem: netem-extended-perf-* artifacts, per-pairing numbers and netem drops (docs/testing.md's netem section). compat-n2: the Go/Playwright previous-release (N-2) compatibility matrix (docs/testing.md's browser previous-release matrix section). engines: the WebKit and full cross-engine matrix run on macos-15 (docs/testing.md's Engines section). relay-full: relay-only TURN transfers, per-session allocation accounting, quota and consent controls (relay-turn-stats-extended artifact; docs/testing.md's TURN relay section). large: 1 GiB transfer pairings, stalls/integrity/memory scaling across clean and wan150 profiles (large-perf-* artifacts; docs/testing.md's large-transfer section)."
          body=$(printf '%s\n\nFailed job(s):\n%s\n%s\n' "$note" "$jobs" "$detail")

          if [[ -n "$existing" && "$existing" != "null" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label extended-checks --body "$body"
          fi
