name: Nightly netem WAN benchmarks

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netem-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [wan150-cap, wan500]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build-web
      - name: Build CLI and server binaries
        run: |
          go build -o bin/sp2p ./cmd/sp2p
          go build -o bin/sp2p-server ./cmd/sp2p-server
      # Everything above needs the network; nothing below should — the
      # netem suite runs inside a namespace with no route to the internet.
      - run: cd web && npx playwright install --with-deps chromium
      - name: Load the netem qdisc kernel module
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
      - name: Ensure ethtool is available
        run: command -v ethtool || (sudo apt-get update && sudo apt-get install -y ethtool)
      - name: Widen host UDP socket buffer ceilings (for Chrome's 1 MiB buffer hint)
        run: sudo sysctl -w net.core.rmem_max=4194304 net.core.wmem_max=4194304
      - name: Create the sp2p network namespace
        run: sudo scripts/ci/netns.sh up
      - name: Apply netem shaping (${{ matrix.profile }})
        run: sudo scripts/ci/netem.sh apply ${{ matrix.profile }}
      - name: Preflight — hard-fail unless the shaped RTT is in band
        run: sudo scripts/ci/netem.sh verify
      - name: Run the netem suite inside the namespace (repeat-each=3)
        run: |
          cd web
          "$GITHUB_WORKSPACE/scripts/ci/netns.sh" exec -- npx playwright test --project=netem --repeat-each=3
        env:
          SP2P_NETEM_PROFILE: ${{ matrix.profile }}
          SP2P_PW_SKIP_WEB_BUILD: "1"
          SP2P_PW_CLI_BIN: ${{ github.workspace }}/bin/sp2p
          SP2P_PW_SERVER_BIN: ${{ github.workspace }}/bin/sp2p-server
      - name: netem qdisc stats (post-run, for the job log)
        if: always()
        run: sudo scripts/ci/netem.sh stats || true
      - name: Performance summary (gate on medians of the 3 repeats)
        if: always()
        run: node web/tests/perf-summary.mjs --gate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: netem-nightly-perf-${{ matrix.profile }}
          path: test-results/perf/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: netem-nightly-playwright-report-${{ matrix.profile }}
          path: web/test-results/**
          if-no-files-found: ignore
      - name: Tear down the network namespace
        if: always()
        run: sudo scripts/ci/netns.sh down

  # Runs regardless of which matrix leg(s) failed (fail-fast is off), and
  # only on failure — a green night is silent.
  report-failure:
    needs: netem-nightly
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create nightly --color b60205 \
            --description "Nightly netem WAN benchmark failures" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          title="Nightly netem WAN benchmark failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number')

          note="Run: $RUN_URL (branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA:0:12}\`)."
          detail="See the job summary and the netem-nightly-perf-* / netem-nightly-playwright-report-* artifacts on this run for per-pairing numbers, netem drops, and traces. See docs/testing.md for the netem suite design and how to reproduce it locally on Linux."
          body=$(printf '%s\n\n%s\n' "$note" "$detail")

          if [[ -n "$existing" && "$existing" != "null" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$note"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label nightly --body "$body"
          fi
